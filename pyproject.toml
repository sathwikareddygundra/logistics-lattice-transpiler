[project]
name = "logistics-lattice-transpiler"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.6",
    "sqlglot>=30.30.0",
    "structlog>=26.1.0",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.3.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/golden"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"dashboard/update.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
exclude = ["tests/golden/"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
